<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#202020" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#smallGrid)"/>
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#303030" stroke-width="1.2"/>
    </pattern>
    <style>
      .bg { fill: #111111; }
      .box { fill: #111111; stroke: #eeeeee; stroke-width: 2; }
      .wire { fill: none; stroke: #eeeeee; stroke-width: 2; }
      .pin { fill: #111111; stroke: #eeeeee; stroke-width: 2; }
      .label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 20px; }
      .small { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
      .tiny { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
      .title { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 34px; }
      .note { fill: #eeeeee; font-family: Arial, Helvetica, sans-serif; font-size: 24px; }
      .noteBold { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 27px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>
  <rect x="0" y="0" width="1800" height="900" fill="url(#grid)"/>

  <!-- NUCLEO-G431RB block -->
  <rect class="box" x="90" y="220" width="230" height="230"/>
  <circle class="pin" cx="180" cy="220" r="14"/>
  <circle class="pin" cx="245" cy="220" r="14"/>
  <circle class="pin" cx="180" cy="450" r="14"/>
  <circle class="pin" cx="245" cy="450" r="14"/>
  <text class="small" x="126" y="260">FDCAN_TX</text>
  <text class="small" x="219" y="260">FDCAN_RX</text>
  <text class="small" x="155" y="420">GND</text>
  <text class="small" x="226" y="420">3.3V</text>
  <text class="label" x="154" y="320">NUCLEO-</text>
  <text class="label" x="161" y="347">G431RB</text>

  <!-- SN65HVD230 block -->
  <rect class="box" x="540" y="205" width="250" height="250"/>
  <circle class="pin" cx="630" cy="205" r="14"/>
  <circle class="pin" cx="700" cy="205" r="14"/>
  <circle class="pin" cx="765" cy="280" r="14"/>
  <circle class="pin" cx="765" cy="350" r="14"/>
  <circle class="pin" cx="630" cy="455" r="14"/>
  <circle class="pin" cx="700" cy="455" r="14"/>
  <text class="label" x="619" y="260">TXD</text>
  <text class="label" x="689" y="260">RXD</text>
  <text class="label" x="728" y="305">CANH</text>
  <text class="label" x="730" y="378">CANL</text>
  <text class="label" x="615" y="410">GND</text>
  <text class="label" x="681" y="410">VCC</text>
  <text class="label" x="613" y="320">SN65HVD230</text>
  <text class="label" x="650" y="348">CAN</text>
  <text class="label" x="625" y="376">Transceiver</text>

  <!-- Waveshare block -->
  <rect class="box" x="930" y="200" width="370" height="260"/>
  <circle class="pin" cx="970" cy="240" r="14"/>
  <circle class="pin" cx="970" cy="310" r="14"/>
  <circle class="pin" cx="970" cy="390" r="14"/>
  <text class="label" x="948" y="275">CANH</text>
  <text class="label" x="948" y="347">CANL</text>
  <text class="label" x="948" y="423">GND</text>
  <text class="label" x="1015" y="325">Waveshare USB-CAN Adapter</text>
  <rect class="box" x="1248" y="265" width="52" height="75"/>

  <!-- PC block -->
  <rect class="box" x="1450" y="170" width="330" height="320"/>
  <text class="label" x="1510" y="320">PC / Waveshare Receive Software / C++</text>
  <text class="label" x="1580" y="350">Decoder</text>

  <!-- FDCAN TX/RX wires -->
  <path class="wire" d="M 180 220 L 180 80 L 630 80 L 630 205"/>
  <path class="wire" d="M 245 220 L 245 132 L 700 132 L 700 205"/>
  <text class="label" x="430" y="63">FDCAN1_TX → TXD</text>
  <text class="label" x="420" y="121">FDCAN1_RX ← RXD</text>

  <!-- Power and ground wires -->
  <path class="wire" d="M 245 450 L 245 590 L 700 590 L 700 455"/>
  <path class="wire" d="M 180 450 L 180 690 L 560 690 L 560 760"/>
  <path class="wire" d="M 630 455 L 630 620 L 590 620 L 590 760"/>
  <path class="wire" d="M 970 390 L 970 650 L 620 650 L 620 760"/>

  <!-- Common ground triangle -->
  <path d="M 500 760 L 680 760 L 590 875 Z" fill="#111111" stroke="#eeeeee" stroke-width="2"/>
  <text class="label" x="542" y="812">COMMON</text>
  <text class="label" x="548" y="842">GROUND</text>

  <!-- CAN bus wires and termination -->
  <path class="wire" d="M 765 280 L 850 280 L 850 242 L 970 242"/>
  <path class="wire" d="M 765 350 L 850 350 L 850 312 L 970 312"/>
  <rect class="box" x="800" y="302" width="58" height="30"/>
  <text class="small" x="807" y="324">120 Ω</text>
  <path class="wire" d="M 829 280 L 829 302"/>
  <path class="wire" d="M 829 332 L 829 350"/>

  <!-- USB wire -->
  <path class="wire" d="M 1300 302 L 1450 302"/>

  <!-- Bottom figure panel -->
  <rect x="0" y="900" width="1800" height="220" fill="#111111"/>
  <line x1="0" y1="900" x2="1800" y2="900" stroke="#eeeeee" stroke-width="2"/>
  <text class="title" x="430" y="955">Figure 1. STM32 FreeRTOS CAN Hardware Wiring Schematic</text>
  <text class="noteBold" x="80" y="1005">Notes:</text>
  <text class="note" x="80" y="1040">PA12 / FDCAN1_TX → TXD and PA11 / FDCAN1_RX ← RXD are STM32 logic-level CAN signals.</text>
  <text class="note" x="80" y="1070">SN65HVD230 converts logic-level CAN to physical CANH/CANL; STM32 pins do not connect directly to CANH/CANL.</text>
  <text class="note" x="80" y="1100">Bus: Classic CAN, 500 kbps, standard 11-bit IDs, DLC = 8 bytes. Termination: external 120 Ω + Waveshare 120 Ω → about 60 Ω measured power off.</text>
</svg>
