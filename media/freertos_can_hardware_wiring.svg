<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f5f5f5"/>
    </marker>
    <style>
      .bg { fill: #111111; }
      .box { fill: #181818; stroke: #f5f5f5; stroke-width: 2; }
      .pin { fill: #111111; stroke: #f5f5f5; stroke-width: 2; }
      .wire { stroke: #f5f5f5; stroke-width: 2.2; fill: none; }
      .bus { stroke: #f5f5f5; stroke-width: 3; fill: none; }
      .text { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .small { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .tiny { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
      .label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; }
      .title { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="560"/>

  <text class="title" x="750" y="34" text-anchor="middle">STM32 FreeRTOS CAN Hardware Wiring</text>

  <!-- Nucleo block -->
  <rect class="box" x="60" y="130" width="220" height="220"/>
  <text class="text" x="170" y="220" text-anchor="middle">NUCLEO-G431RB</text>
  <circle class="pin" cx="95" cy="155" r="11"/>
  <text class="tiny" x="95" y="186" text-anchor="middle">FDCAN_TX</text>
  <circle class="pin" cx="245" cy="155" r="11"/>
  <text class="tiny" x="245" y="186" text-anchor="middle">FDCAN_RX</text>
  <circle class="pin" cx="95" cy="330" r="11"/>
  <text class="tiny" x="95" y="305" text-anchor="middle">GND</text>
  <circle class="pin" cx="245" cy="330" r="11"/>
  <text class="tiny" x="245" y="305" text-anchor="middle">3.3V</text>

  <!-- Transceiver block -->
  <rect class="box" x="455" y="120" width="260" height="240"/>
  <text class="text" x="585" y="220" text-anchor="middle">SN65HVD230</text>
  <text class="text" x="585" y="245" text-anchor="middle">CAN Transceiver</text>
  <circle class="pin" cx="500" cy="145" r="11"/>
  <text class="tiny" x="500" y="176" text-anchor="middle">TXD</text>
  <circle class="pin" cx="670" cy="145" r="11"/>
  <text class="tiny" x="670" y="176" text-anchor="middle">RXD</text>
  <circle class="pin" cx="500" cy="340" r="11"/>
  <text class="tiny" x="500" y="315" text-anchor="middle">GND</text>
  <circle class="pin" cx="670" cy="340" r="11"/>
  <text class="tiny" x="670" y="315" text-anchor="middle">VCC</text>
  <circle class="pin" cx="705" cy="205" r="11"/>
  <text class="tiny" x="676" y="210" text-anchor="end">CANH</text>
  <circle class="pin" cx="705" cy="280" r="11"/>
  <text class="tiny" x="676" y="285" text-anchor="end">CANL</text>

  <!-- Waveshare block -->
  <rect class="box" x="845" y="120" width="310" height="240"/>
  <text class="text" x="1000" y="250" text-anchor="middle">Waveshare USB-CAN Adapter</text>
  <circle class="pin" cx="880" cy="165" r="11"/>
  <text class="small" x="910" y="171">CANH</text>
  <circle class="pin" cx="880" cy="240" r="11"/>
  <text class="small" x="910" y="246">CANL</text>
  <circle class="pin" cx="880" cy="315" r="11"/>
  <text class="small" x="910" y="321">GND</text>
  <rect x="1128" y="220" width="27" height="60" fill="#111111" stroke="#f5f5f5" stroke-width="2"/>

  <!-- PC block -->
  <rect class="box" x="1245" y="155" width="220" height="170"/>
  <text class="text" x="1355" y="235" text-anchor="middle">PC / Waveshare</text>
  <text class="text" x="1355" y="260" text-anchor="middle">Receive Software</text>
  <text class="text" x="1355" y="285" text-anchor="middle">/ C++ Decoder</text>

  <!-- Wires Nucleo to transceiver -->
  <path class="wire" d="M95 155 L95 80 L500 80 L500 134"/>
  <text class="label" x="300" y="67" text-anchor="middle">PA12 / FDCAN1_TX → TXD</text>

  <path class="wire" d="M670 134 L670 95 L245 95 L245 155"/>
  <text class="label" x="460" y="115" text-anchor="middle">PA11 / FDCAN1_RX ← RXD</text>

  <path class="wire" d="M245 341 L245 455 L670 455 L670 351"/>
  <text class="small" x="420" y="474" text-anchor="middle">3.3V → VCC</text>

  <path class="wire" d="M95 341 L95 490 L500 490 L500 351"/>

  <!-- CAN bus wires -->
  <path class="bus" d="M716 205 L800 205 L800 165 L869 165"/>
  <path class="bus" d="M716 280 L800 280 L800 240 L869 240"/>
  <text class="label" x="785" y="142" text-anchor="middle">CANH / CANL physical bus</text>

  <!-- Termination resistor -->
  <rect x="765" y="213" width="50" height="28" fill="#181818" stroke="#f5f5f5" stroke-width="2"/>
  <text class="small" x="790" y="233" text-anchor="middle">120 Ω</text>
  <path class="wire" d="M790 205 L790 213"/>
  <path class="wire" d="M790 241 L790 280"/>

  <!-- Ground from Waveshare -->
  <path class="wire" d="M880 326 L880 490 L500 490"/>

  <!-- USB to PC -->
  <path class="wire" d="M1155 250 L1245 250" marker-end="url(#arrow)"/>
  <text class="small" x="1200" y="235" text-anchor="middle">USB</text>

  <!-- Common ground symbol -->
  <polygon points="385,495 455,495 420,545" fill="#181818" stroke="#f5f5f5" stroke-width="2"/>
  <text class="small" x="420" y="518" text-anchor="middle">COMMON</text>
  <text class="small" x="420" y="538" text-anchor="middle">GROUND</text>
  <path class="wire" d="M420 490 L420 495"/>

  <!-- Notes -->
  <text class="small" x="750" y="405" text-anchor="middle">Classic CAN • 500 kbps • Standard 11-bit IDs • DLC = 8 bytes</text>
  <text class="small" x="750" y="430" text-anchor="middle">CANH-to-CANL measured about 60 Ω with power off, confirming two active 120 Ω terminations in parallel.</text>
  <text class="small" x="750" y="455" text-anchor="middle">STM32 FDCAN_TX/FDCAN_RX do not connect directly to CANH/CANL; the SN65HVD230 performs the physical bus conversion.</text>
</svg>
